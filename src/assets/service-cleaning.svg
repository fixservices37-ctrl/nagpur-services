<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder banner for the Cleaning service card. Replace with a real photo when available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Bathroom and kitchen cleaning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ecf8"/>
      <stop offset="1" stop-color="#c8d9ee"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fb5"/>
      <stop offset="1" stop-color="#1e4d80"/>
    </linearGradient>
    <linearGradient id="spray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a34b"/>
      <stop offset="1" stop-color="#e08427"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" fill="url(#bg)"/>

  <!-- Soft floor shadow -->
  <ellipse cx="450" cy="560" rx="320" ry="24" fill="#1e4d80" opacity="0.10"/>

  <!-- Spray bottle -->
  <g transform="translate(280 140)">
    <path d="M40 60 h60 v-30 h30 v30 h30 v40 h-120 z" fill="url(#spray)"/>
    <rect x="140" y="70" width="12" height="30" fill="#e08427"/>
    <path d="M35 100 h140 l-10 260 a30 30 0 0 1 -30 26 h-60 a30 30 0 0 1 -30 -26 z" fill="url(#bottle)"/>
    <rect x="60" y="180" width="90" height="90" rx="6" fill="#ffffff" opacity="0.92"/>
    <path d="M74 205 h62 M74 225 h50 M74 245 h62" stroke="#1e4d80" stroke-width="4" stroke-linecap="round"/>
    <!-- Little spray droplets -->
    <g fill="#f3a34b">
      <circle cx="205" cy="70" r="6"/>
      <circle cx="235" cy="55" r="4"/>
      <circle cx="240" cy="90" r="5"/>
      <circle cx="265" cy="70" r="3"/>
    </g>
  </g>

  <!-- Sponge -->
  <g transform="translate(540 320)">
    <rect x="0" y="0" width="230" height="120" rx="16" fill="#f3a34b"/>
    <rect x="0" y="0" width="230" height="40" rx="16" fill="#f6ba71"/>
    <g fill="#ffffff" opacity="0.8">
      <circle cx="40" cy="70" r="6"/>
      <circle cx="80" cy="90" r="5"/>
      <circle cx="120" cy="70" r="7"/>
      <circle cx="160" cy="95" r="5"/>
      <circle cx="200" cy="75" r="6"/>
    </g>
  </g>

  <!-- Bubbles -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="180" r="26"/>
    <circle cx="200" cy="220" r="14"/>
    <circle cx="700" cy="150" r="22"/>
    <circle cx="750" cy="190" r="12"/>
    <circle cx="620" cy="240" r="16"/>
  </g>
</svg>
